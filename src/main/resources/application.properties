# Datasource
quarkus.datasource.db-kind=${DB_KIND:postgresql}
quarkus.datasource.username=${DB_USERNAME:todo_user}
quarkus.datasource.password=${DB_PASSWORD:todo_pass}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/todo_mobile}

# Schema management
quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:update}

# App metadata
app.name=backend-web-mobile
app.version=${APP_VERSION:dev}

# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# CORS
quarkus.http.cors.origins=*
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Location,Info

# Test profile: H2 in-memory
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
